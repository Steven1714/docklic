<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-QHY2PM07NM"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-QHY2PM07NM', {send_page_view: false});
</script>
<title id="page-title">Doclick — Enlaces</title>
<meta name="description" id="page-desc" content="Agenda tu cita por WhatsApp. Perfil verificado en Doclick.">
<meta name="robots" content="noindex">
<meta name="theme-color" id="theme-color" content="#0D4A3A">
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta property="og:title" id="og-title" content="Doclick — Enlaces">
<meta property="og:description" id="og-desc" content="Agenda tu cita por WhatsApp. Perfil verificado en Doclick.">
<meta property="og:image" id="og-image" content="https://doclick.net/images/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="landing.css">
</head>
<body>

<div class="stage">
  <main class="lp" id="lp"><p class="loading">Cargando…</p></main>
</div>
<div class="dock" id="dock" aria-hidden="true"></div>

<script src="data.js"></script>
<script>
// Uso: link.html?id=7  (o la URL corta definida en _redirects, ej. doclick.net/drvegas)
const UTM='utm_source=instagram&utm_medium=bio&utm_campaign=landing_medico';
function trackLink(doctorId,type){gtag('event','click_link_bio',{doctor_id:doctorId,link_type:type});}
function isPending(text){return !text||text.includes('[Pendiente');}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
// Texto oscuro o claro sobre el color de acento, según su luminancia
function inkFor(hex){const n=parseInt(hex.replace('#',''),16);const [r,g,b]=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});return (0.2126*r+0.7152*g+0.0722*b)>0.3?'#16120E':'#FFFFFF';}
function formatVePhone(num){const d=String(num).replace(/^58/,'');return d.length===10?`0${d.slice(0,3)}-${d.slice(3,6)}.${d.slice(6,8)}.${d.slice(8)}`:num;}

const ICON={
  wa:`<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.1-.2.3-.8.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.4-.5c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.7-.7 1.9-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.3zM12 21.8c-1.8 0-3.5-.5-5-1.4l-.4-.2-3.7 1 1-3.6-.2-.4C2.7 15.6 2.2 13.8 2.2 12 2.2 6.6 6.6 2.2 12 2.2S21.8 6.6 21.8 12 17.4 21.8 12 21.8zM12 .2C5.5.2.2 5.5.2 12c0 2.1.5 4.1 1.6 5.9L.1 24l6.3-1.7c1.7.9 3.7 1.4 5.6 1.4 6.5 0 11.8-5.3 11.8-11.8S18.5.2 12 .2z"/></svg>`,
  arrow:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`,
  share:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v13"/></svg>`,
  check:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
  pin:`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`,
  ig:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg>`,
  user:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>`,
  play:`<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>`
};

const DEFAULT_THEME={deep:'#0D4A3A',accent:'#C4956A',paper:'#F7F5F2',ink:'#1A1A1A',soft:'#5C6B66'};
const doctor=getDoctorById(new URLSearchParams(window.location.search).get('id'));
const lp=document.getElementById('lp');

if(!doctor){
  gtag('event','page_view');
  lp.innerHTML=`<div class="notfound"><h1>Enlace no encontrado</h1><p>Este enlace no existe o ha sido removido.</p><a href="index.html?${UTM}">Buscar médicos en Doclick</a></div>`;
} else if(!hasFeaturedPlan(doctor)){
  // La landing de Instagram es parte de Pro/Fundador; el plan Perfil va directo a su perfil.
  window.location.replace(`perfil.html?id=${doctor.id}&${UTM}`);
} else {
  const L=doctor.landing||{};
  const T={...DEFAULT_THEME,...(L.theme||{})};
  const root=document.documentElement.style;
  ['deep','accent','paper','ink','soft'].forEach(k=>root.setProperty(`--${k}`,T[k]));
  root.setProperty('--accent-ink',inkFor(T.accent));
  document.getElementById('theme-color').content=T.deep;

  const fullName=`${doctor.title} ${doctor.name}`;
  const pageTitle=`${fullName} — ${doctor.specialty} | Doclick`;
  document.title=pageTitle;
  document.getElementById('og-title').content=pageTitle;
  if(!isPending(doctor.shortBio)){document.getElementById('page-desc').content=doctor.shortBio;document.getElementById('og-desc').content=doctor.shortBio;}
  // Sin portada vertical propia, se usa un encabezado compacto con la foto en círculo
  const coverUrl=L.coverUrl;
  const ogImg=coverUrl||doctor.photoUrl;
  if(ogImg)document.getElementById('og-image').content=`${DOCLICK.domain}/${ogImg}`;
  gtag('event','page_view',{page_title:pageTitle});
  gtag('event','view_link_bio',{doctor_id:doctor.id,plan:doctor.plan});

  const numbers=doctor.whatsappNumbers||[doctor.whatsappNumber];
  const waMsg='Hola, vi tu Instagram y quiero agendar una cita.';
  const waMain=buildWaLink(numbers[0],waMsg);
  const regParts=[doctor.mpps?`MPPS ${doctor.mpps}`:'',doctor.cmm?`CMM ${doctor.cmm}`:''].filter(Boolean);
  const founder=doctor.plan==='fundador'?(doctor.title==='Dra.'?'Médica fundadora':'Médico fundador'):'Doclick Pro';
  let n=0;const num=()=>String(++n).padStart(2,'0');

  // Portada
  const coverHtml=`
    <header class="cover${coverUrl?'':' cover--compact'}">
      ${coverUrl?`<img src="${coverUrl}" alt="${esc(fullName)}" fetchpriority="high">`:''}
      <div class="topbar">
        <a class="pill glass" href="index.html?${UTM}" onclick="trackLink(${doctor.id},'logo')" aria-label="Ir a Doclick"><img src="images/logo-doclick-blanco.png" alt="Doclick" class="pill-logo" width="96" height="18"></a>
        <button class="icon-btn glass" id="share" type="button" aria-label="Compartir esta página">${ICON.share}</button>
      </div>
      <div class="cover-body">
        <div class="who">
          ${coverUrl?'':`<div class="cover-avatar">${doctor.photoUrl?`<img src="${doctor.photoUrl}" alt="${esc(fullName)}">`:doctor.initials}</div>`}
          ${L.logoUrl?`<img class="cover-logo" src="${L.logoUrl}" alt="Logo de ${esc(fullName)}">`:''}
          <div class="badge glass">${founder}</div>
          <h1><small>${doctor.title}</small>${esc(doctor.name)}</h1>
          <p class="spec">${esc(doctor.specialty)}</p>
          ${regParts.length?`<p class="reg">${regParts.join(' · ')}</p>`:''}
        </div>
      <a class="btn-main" id="main-cta" href="${waMain}" target="_blank" rel="noopener" onclick="trackLink(${doctor.id},'whatsapp')">
        <span class="ic">${ICON.wa}</span>
        <span><strong>Agenda tu cita</strong><span>WhatsApp · ${formatVePhone(numbers[0])}</span></span>
        <span class="arrow">${ICON.arrow}</span>
      </a>
      ${numbers.length>1?`<div class="alt-lines">${numbers.slice(1).map((num,i)=>`<a class="glass" href="${buildWaLink(num,waMsg)}" target="_blank" rel="noopener" onclick="trackLink(${doctor.id},'whatsapp')">Línea ${i+2} · ${formatVePhone(num)}</a>`).join('')}</div>`:''}
      ${(L.facts||[]).length?`<div class="facts glass" role="list" aria-label="Datos destacados">${L.facts.slice(0,3).map(([b,s])=>`<div class="fact" role="listitem"><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join('')}</div>`:''}
      <p class="verified">${ICON.check}Perfil verificado por Doclick</p>
      </div>
    </header>`;

  const aboutHtml=!isPending(doctor.shortBio)?`
    <section class="block" aria-label="Sobre ${esc(fullName)}">
      <p class="eyebrow"><i>${num()}</i>Sobre ${doctor.title==='Dra.'?'la doctora':'el doctor'}</p>
      <p class="lead">${esc(doctor.shortBio)}</p>
      ${(doctor.specialties||[]).length?`<ul class="chips" aria-label="Áreas de atención">${doctor.specialties.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:''}
    </section>`:'';

  const v=doctor.heroVideo;
  const videoHtml=v&&v.youtubeId?`
    <section class="block" aria-label="Video">
      <p class="eyebrow"><i>${num()}</i>Conócele en video</p>
      <button class="video" id="video" type="button" aria-label="Reproducir: ${esc(v.title)}">
        <img src="https://i.ytimg.com/vi/${v.youtubeId}/hqdefault.jpg" alt="" loading="lazy">
        <span class="play"><span>${ICON.play}</span></span>
      </button>
      <p class="video-cap">${esc(v.title)}${v.duration?`<span>${v.duration}</span>`:''}</p>
    </section>`:'';

  const hasAddress=!isPending(doctor.address);
  const scheduleRows=!isPending(doctor.schedule)?doctor.schedule.split(' · ').map(part=>{const i=part.indexOf(':');return i>0&&i<20?`<div><dt>${esc(part.slice(0,i))}</dt><dd>${esc(part.slice(i+1).trim())}</dd></div>`:`<div><dt></dt><dd>${esc(part)}</dd></div>`;}).join(''):'';
  const placeHtml=hasAddress||scheduleRows?`
    <section class="block" aria-label="Consulta">
      <p class="eyebrow"><i>${num()}</i>Consulta</p>
      ${hasAddress?`<p class="place">${esc(doctor.address)}</p>`:''}
      ${scheduleRows?`<dl class="hours">${scheduleRows}</dl>`:''}
      ${hasAddress?`<a class="btn-line" href="${doctor.mapUrl||buildMapsLink(doctor.mapQuery||doctor.address)}" target="_blank" rel="noopener" onclick="trackLink(${doctor.id},'maps')">${ICON.pin}Cómo llegar</a>`:''}
    </section>`:'';

  const rows=[];
  if(doctor.instagramHandle)rows.push(`<a href="https://instagram.com/${doctor.instagramHandle}" target="_blank" rel="noopener" onclick="trackLink(${doctor.id},'instagram')"><span class="ri">${ICON.ig}</span><span><strong>Instagram</strong><small>@${esc(doctor.instagramHandle)}</small></span><span class="go">${ICON.arrow}</span></a>`);
  rows.push(`<a href="perfil.html?id=${doctor.id}&${UTM}" onclick="trackLink(${doctor.id},'perfil')"><span class="ri">${ICON.user}</span><span><strong>Perfil completo</strong><small>${v&&v.youtubeId?'Video, horarios y más en Doclick':'Horarios y más en Doclick'}</small></span><span class="go">${ICON.arrow}</span></a>`);
  const linksHtml=`<section class="block rows" aria-label="Más enlaces">${rows.join('')}</section>`;

  const footHtml=`
    <footer class="foot">
      <h2>¿Buscas otro especialista?</h2>
      <p>En Doclick encuentras médicos verificados en video y les escribes directo por WhatsApp.</p>
      <a class="explore" href="index.html?${UTM}#directorio" onclick="trackLink(${doctor.id},'directorio')">Explorar la guía Doclick ${ICON.arrow}</a>
      <div class="sign"><span>Página creada por Doclick</span><a href="${buildWaLink(DOCLICK.contactWhatsapp,DOCLICK.contactMessage)}" target="_blank" rel="noopener" onclick="trackLink(${doctor.id},'recruitment')">¿Eres médico?</a></div>
    </footer>`;

  lp.innerHTML=coverHtml+`<div class="lower">${aboutHtml+videoHtml+placeHtml+linksHtml}</div>`+footHtml;

  // Video: carga el reproductor solo al tocar
  const vb=document.getElementById('video');
  if(vb)vb.addEventListener('click',()=>{trackLink(doctor.id,'video');vb.innerHTML=`<iframe src="https://www.youtube.com/embed/${v.youtubeId}?autoplay=1&rel=0" title="${esc(v.title)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;},{once:true});

  // Compartir
  document.getElementById('share').addEventListener('click',async()=>{
    trackLink(doctor.id,'share');
    const data={title:fullName,text:`${fullName} — ${doctor.specialty}`,url:location.href};
    try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(location.href);alert('Enlace copiado');}}catch(e){}
  });

  // Barra fija de WhatsApp cuando el botón principal sale de pantalla
  const dock=document.getElementById('dock');
  dock.innerHTML=`<a href="${waMain}" target="_blank" rel="noopener" onclick="trackLink(${doctor.id},'whatsapp_dock')">${ICON.wa}Agendar por WhatsApp</a>`;
  if('IntersectionObserver' in window){
    new IntersectionObserver(([e])=>{const on=!e.isIntersecting&&e.boundingClientRect.top<0;dock.classList.toggle('on',on);dock.setAttribute('aria-hidden',String(!on));}).observe(document.getElementById('main-cta'));
  }
}
</script>

</body>
</html>
