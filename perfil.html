<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-QHY2PM07NM"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-QHY2PM07NM', {send_page_view: false});
</script>
<title id="page-title">Doclick — Perfil médico</title>
<meta name="description" id="page-desc" content="Perfil médico verificado en Doclick.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230D4A3A'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='Georgia' font-weight='bold' font-size='55' fill='white'%3ED%3C/text%3E%3C/svg%3E">
<meta property="og:title" id="og-title" content="Doclick — Perfil médico">
<meta property="og:description" id="og-desc" content="Perfil médico verificado en Doclick.">
<meta property="og:type" content="profile">
<meta property="og:url" content="https://doclick.net/perfil.html">
<meta property="og:image" content="https://doclick.net/images/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" id="tw-title" content="Doclick — Perfil médico">
<meta name="twitter:description" id="tw-desc" content="Perfil médico verificado en Doclick.">
<script type="application/ld+json" id="schema-json"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="nav" id="navbar">
  <div class="wrap">
    <a href="index.html" class="logo"><div class="logo-mark">D</div>Doclick</a>
    <div class="nav-actions">
      <a href="index.html#directorio" class="btn btn-ghost" style="font-size:13px;padding:10px 16px;">Buscar médico</a>
      <a class="btn btn-primary" id="nav-cta" href="#" style="font-size:13px;padding:10px 16px;">Soy médico, quiero mi perfil</a>
    </div>
  </div>
</header>

<main id="profile-main">
  <div style="padding:120px 24px;text-align:center;color:var(--muted);"><p>Cargando perfil...</p></div>
</main>

<footer>
  <div class="wrap">
    <div class="footer-brand"><div class="logo-mark" style="width:26px;height:26px;font-size:11px;">D</div>© 2026 Doclick — guía médica con video</div>
    <div class="mono">Hecho por médicos, para médicos.</div>
  </div>
</footer>

<script src="data.js"></script>
<script>
window.addEventListener('scroll',()=>{document.getElementById('navbar').classList.toggle('scrolled',window.scrollY>10);});
function trackWhatsapp(doctorId,plan){gtag('event','click_whatsapp',plan?{doctor_id:doctorId,plan:plan}:{doctor_id:doctorId});}
document.getElementById('nav-cta').href=buildWaLink(DOCLICK.contactWhatsapp,DOCLICK.contactMessage);
document.getElementById('nav-cta').addEventListener('click',()=>trackWhatsapp('recruitment'));

const params=new URLSearchParams(window.location.search);
const doctorId=parseInt(params.get('id'));
const doctor=getDoctorById(doctorId);
const main=document.getElementById('profile-main');

if(!doctor){
  gtag('event','page_view');
  main.innerHTML=`<div class="wrap" style="padding:120px 24px;text-align:center;"><h1 style="font-size:28px;margin-bottom:16px;font-family:'Playfair Display',serif;">Médico no encontrado</h1><p style="color:var(--muted);margin-bottom:24px;">El perfil que buscas no existe o ha sido removido.</p><a href="index.html#directorio" class="btn btn-primary">Ver directorio médico</a></div>`;
} else {
  const fullName=`${doctor.title} ${doctor.name}`;
  const city=doctor.city||'Maturín';
  const pageTitle=`${fullName} — ${doctor.specialty} en ${city} | Doclick`;
  document.title=pageTitle;
  document.getElementById('page-title').textContent=pageTitle;
  document.getElementById('page-desc').content=`${doctor.specialty} en ${city}. Perfil con video, WhatsApp directo.`;
  gtag('event','page_view',{page_title:pageTitle});
  gtag('event','view_profile',{doctor_id:doctor.id,plan:doctor.plan});
  document.getElementById('og-title').content=pageTitle;
  document.getElementById('og-desc').content=doctor.shortBio;
  document.getElementById('tw-title').content=pageTitle;
  document.getElementById('tw-desc').content=doctor.shortBio;

  const schema={"@context":"https://schema.org","@type":"Physician","name":fullName,"medicalSpecialty":doctor.specialty,"telephone":`+${doctor.whatsappNumber}`,"url":window.location.href,"description":doctor.shortBio};
  document.getElementById('schema-json').textContent=JSON.stringify(schema);

  const foundingBadge=doctor.plan==='fundador'?`<div class="badge-founding" style="margin-bottom:14px;">Médico fundador · Doclick</div>`:'';
  const videoBadge=doctor.hasVideo?`<span class="tag" style="background:rgba(196,149,106,0.15);color:var(--copper-dark);border-color:rgba(196,149,106,0.3);"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg> Con video</span>`:'';

  const regParts=[doctor.mpps?`MPPS ${doctor.mpps}`:'',doctor.cmm?`CMM ${doctor.cmm}`:''].filter(Boolean);
  const regHtml=regParts.length?`<p class="profile-reg">${regParts.join(' · ')}</p>`:'';

  const heroVideoHtml=doctor.heroVideo?`
    <section class="profile-section" aria-labelledby="video-heading">
      <div class="wrap">
        <span class="eyebrow">Video del mes</span>
        <div class="video-hero">
          ${doctor.heroVideo.youtubeId?`
          <div class="video-embed">
            <iframe src="https://www.youtube.com/embed/${doctor.heroVideo.youtubeId}" title="${doctor.heroVideo.title}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
          </div>`:`
          <div class="video-placeholder" role="img" aria-label="Video del mes: ${doctor.heroVideo.title}. Próximamente disponible.">
            <div class="play-btn" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="white" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
            <p>Próximamente disponible</p>
          </div>`}
          <div class="video-info"><h3 id="video-heading">${doctor.heroVideo.title}</h3><span class="mono">${doctor.heroVideo.duration}</span></div>
        </div>
      </div>
    </section>`:'';

  const specialtiesHtml=(doctor.specialties||[]).length?`
    <section class="profile-section" aria-labelledby="specialties-heading">
      <div class="wrap"><h2 id="specialties-heading">Áreas de atención</h2><div class="chips-list">${doctor.specialties.map(s=>`<span class="chip">${s}</span>`).join('')}</div></div>
    </section>`:'';

  const bioHtml=doctor.longBio?`
    <section class="profile-section" aria-labelledby="bio-heading">
      <div class="wrap"><h2 id="bio-heading">Sobre ${doctor.title} ${doctor.name.split(' ').pop()}</h2><p class="bio-text">${doctor.longBio}</p></div>
    </section>`:'';

  const pastVideosHtml=(doctor.pastVideos||[]).length?`
    <section class="profile-section" aria-labelledby="past-videos-heading">
      <div class="wrap">
        <h2 id="past-videos-heading">Contenido publicado</h2>
        <div class="past-videos-grid">${doctor.pastVideos.map(v=>v.youtubeId?`<a class="past-video-card" href="https://youtube.com/watch?v=${v.youtubeId}" target="_blank" rel="noopener" aria-label="Ver ${v.title} en YouTube"><div class="past-video-thumb" style="background-image:url('https://img.youtube.com/vi/${v.youtubeId}/hqdefault.jpg');background-size:cover;background-position:center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="rgba(255,255,255,0.9)" stroke="none" style="filter:drop-shadow(0 1px 4px rgba(0,0,0,0.5));"><polygon points="5 3 19 12 5 21 5 3"/></svg></div><div class="past-video-info"><h4>${v.title}</h4><span class="mono">${v.duration}</span></div></a>`:`<article class="past-video-card"><div class="past-video-thumb" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg></div><div class="past-video-info"><h4>${v.title}</h4><span class="mono">${v.duration}</span></div></article>`).join('')}</div>
      </div>
    </section>`:'';

  const locationHtml=doctor.address?`
    <section class="profile-section" aria-labelledby="location-heading">
      <div class="wrap">
        <h2 id="location-heading">Ubicación y horario</h2>
        <div class="location-card">
          <div class="location-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
          <div class="location-details"><h3>${doctor.address}</h3>${doctor.schedule?`<p>${doctor.schedule}</p>`:''}<a href="${buildMapsLink(doctor.mapQuery||doctor.address)}" target="_blank" rel="noopener">Ver en Google Maps →</a></div>
        </div>
      </div>
    </section>`:'';

  main.innerHTML=`
    <section class="profile-hero" aria-label="Información principal del médico">
      <div class="wrap">
        <div class="profile-avatar" aria-hidden="true">${doctor.photoUrl?`<img src="${doctor.photoUrl}" alt="">`:doctor.initials}</div>
        <div class="profile-info">
          ${foundingBadge}
          <h1>${fullName}</h1>
          <div class="profile-meta">
            <span class="tag">${doctor.specialty}</span>
            ${videoBadge}
          </div>
          ${regHtml}
          ${doctor.shortBio?`<p class="profile-bio-short">${doctor.shortBio}</p>`:''}
          <div class="profile-actions">
            ${(doctor.whatsappNumbers||[doctor.whatsappNumber]).map((num,i,arr)=>`
            <a class="btn btn-primary" href="${buildWaLink(num,'Hola, vi tu perfil en Doclick y quiero agendar una cita.')}" target="_blank" rel="noopener" onclick="trackWhatsapp(${doctor.id},'${doctor.plan}')" aria-label="Agendar cita por WhatsApp${arr.length>1?` (línea ${i+1})`:''}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
              Agendar por WhatsApp${arr.length>1?` (línea ${i+1})`:''}
            </a>`).join('')}
            ${doctor.instagramHandle?`<a class="btn btn-ghost" href="https://instagram.com/${doctor.instagramHandle}" target="_blank" rel="noopener" aria-label="Ver Instagram de ${fullName}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>Ver Instagram</a>`:''}
          </div>
        </div>
      </div>
    </section>
    ${heroVideoHtml}${specialtiesHtml}${bioHtml}${pastVideosHtml}${locationHtml}
    <section style="padding:48px 0;" aria-label="¿Eres médico?">
      <div class="wrap">
        <div class="cta-banner" style="padding:36px;">
          <div>
            <h2 style="font-size:22px;margin-bottom:8px;">¿Eres médico?</h2>
            <p style="margin-bottom:18px;">Aparece en Doclick desde $5/mes. Video opcional. Pacientes buscando hoy.</p>
            <a class="btn btn-copper" href="${buildWaLink(DOCLICK.contactWhatsapp,DOCLICK.contactMessage)}" target="_blank" rel="noopener" onclick="trackWhatsapp('recruitment')">Quiero aparecer</a>
          </div>
        </div>
      </div>
    </section>
    <div class="verified-footer">
      <p><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--forest)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>Perfil verificado por Doclick</p>
    </div>`;
}
</script>

</body>
</html>
